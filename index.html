<!DOCTYPE html>

            <div class="desplegable">
                <button class="botonestil" type="button" aria-expanded="false">
                    Ajuda

                        aria-hidden="true" focusable="false">
                        <path d="M40 150l216 216 216-216" fill="none" stroke="#4A3B32" stroke-width="80"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <!--  ocultar  i nomes  visible al pasar el cursor. -->
                <ul class="menu">
                    <li> <a href="#">Guia</a></li>
                    <li> <a href="#">Documentacio</a></li>
                    <li> <a href="#">Sobre l'aplicacio</a></li>
                </ul>
            </div>
        </nav>


        <nav class="filaInterior" aria-label="Idioma i sessió">

            <div class="desplegable">

                        <path d="M6 8a6 6 0 0 1 12 0c0 7 2 9 2 9H4s2-2 2-9"></path>
                        <!-- La argolla superior -->
                        <path d="M10 3a2 2 0 0 1 4 0"></path>

                        <path d="M9 18a3 3 0 0 0 6 0"></path>
                    </svg>

                    <svg class="iconeFletxa" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"
                        aria-hidden="true" focusable="false">
                        <path d="M40 150l216 216 216-216" fill="none" stroke="#4A3B32" stroke-width="80"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <ul class="menu">
                    <li><button type="button">
                            Missatge:1
                        </button> </li>
                    <li><button type="button">
                            Missatge:2
                        </button></li>

                    <li>
                        <button type="button">
                            Missatge:3
                        </button>
                    </li>


                </ul>
            </div>

            <div class="desplegable">
                <button class="botonestil" type="button" aria-expanded="false" aria-label="Idioma">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" stroke="#4A3B32"

                        <circle cx="258" cy="257" r="192" />
                        <ellipse cx="258" cy="257" rx="101" ry="192" />
                        <path d="M258 65v384M66 257h384M88 168h340M85 341h346" />
                    </svg>

                    <svg class="iconeFletxa" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"
                        aria-hidden="true" focusable="false">
                        <path d="M40 150l216 216 216-216" fill="none" stroke="#4A3B32" stroke-width="80"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>

                </button>
                <ul class="menu">
                    <li><button type="button">
                            Catala
                        </button> </li>
                    <li><button type="button">
                            Angles
                        </button></li>

                    <li>
                        <button type="button">
                            Castella
                        </button>
                    </li>

                </ul>
            </div>



            <div class="desplegable">
                <button class="botonestil" type="button" aria-expanded="false" aria-label="Usuari">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true"
                        focusable="false">
                        <circle cx="253.5" cy="124.5" r="123.5" fill="#4A3B32" />

                            d="M43 414C43 330 85 260 134 250c16-3 26-3 35 2 21 13 46 34 84 34s62-18 89-33c10-6 18-6 27-5 71 10 101 92 101 166 0 61-30 99-75 99H115C73 513 43 475 43 414Z" />
                    </svg>

                    <svg class="iconeFletxa" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"
                        aria-hidden="true" focusable="false">
                        <path d="M40 150l216 216 216-216" fill="none" stroke="#4A3B32" stroke-width="80"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <ul class="menu">
                    <li><button type="button">Perfil</button></li>
                    <li><button type="button">Tancar</button></li>


                </ul>

    <main id="contingut" tabindex="-1">

<div class="grupbts">

            <path d="M8 16h28v44H8z" />
            <path d="M14 12h28v44H14z" />
            <path d="M20 8h22l12 12v36H20z" />
            <path d="M42 8v12h12" fill="none" />
            <path d="M26 30h20M26 36h20M26 42h20M26 48h20" fill="none" />
        </svg>
    </button>

    <button type="button" class="btn-crear" aria-label="Crear carpeta">
        Crear

            stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 28V14a2 2 0 0 1 2-2h14l6 6h22a2 2 0 0 1 2 2v10" />
            <path d="M14 22h36v8H14z" />
            <path d="M6 28h52v24a6 6 0 0 1-6 6H12a6 6 0 0 1-6-6z" />
        </svg>
    </button>
</div>

        <div class="contenidor_ext">

                            stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <circle cx="38" cy="26" r="18" />
                            <circle cx="38" cy="26" r="12" fill="none" />
                            <path d="M25 39L8 56" fill="none" stroke-width="6" />
                            <path d="M25 39L8 56" fill="none" stroke="#F4F0EB" stroke-width="2" />
                        </svg>
                    </button>
                </div>


            </header>

            <div id="scroll">
