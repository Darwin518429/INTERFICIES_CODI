<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sessio</title>
    <link href="../public/css/global.css" rel="stylesheet">
    <link href="../public/css/login.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="../public/js/login/login.js"></script>
</head>

<body>
    <a class="skip-link" href="#contingut">Saltar al contingut principal</a>

    <header class="header">
        <!-- Missatges per canvis de estat  -->
        <div id="avis" aria-live="polite" class="sr-only"></div>
        <h1>WINDOCS</h1>
        <!-- El lector llegira aquest missatge -->
        <nav aria-label="Navegació principal">
            <div class="desplegable">
                <button class="botonestil" type="button" aria-expanded="false">
                    Ajuda
                    <svg class="iconeFletxa" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"
                        aria-hidden="true">
                        <path d="M40 150l216 216 216-216" fill="none" stroke="#4A3B32" stroke-width="80"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <!--  ocultar  i nomes  visible al pasar el cursor. -->
                <ul class="menu">
                    <li> <a href="#">Guia</a></li>
                    <li> <a href="#">Documentacio</a></li>
                    <li> <a href="#">Sobre l'aplicacio</a></li>
                </ul>
            </div>
        </nav>

        <nav class="filaInterior" aria-label="Idioma i sessió">
            <div class="desplegable">
                <button class="botonestil" type="button" aria-label="Idioma" aria-expanded="false">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" stroke="#4A3B32"
                        stroke-width="21" aria-hidden="true">
                        <circle cx="258" cy="257" r="192" />
                        <ellipse cx="258" cy="257" rx="101" ry="192" />
                        <path d="M258 65v384M66 257h384M88 168h340M85 341h346" />
                    </svg>

                    <svg class="iconeFletxa" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"
                        aria-hidden="true">
                        <path d="M40 150l216 216 216-216" fill="none" stroke="#4A3B32" stroke-width="80"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <ul class="menu">
                    <li> <button type="button" lang="ca">Catala</button> </li>
                    <li><button type="button" lang="ca">Anglés</button></li>
                    <li><button type="button" lang="ca">Castella</button></li>
                </ul>
            </div>

            <a class="login" href="./signIn.html">Alta d'usuari</a>
        </nav>
    </header>
    <main id="contingut" tabindex="-1">
        <div class="juntarPanel_img">
            <form class="form_Registrar" action="../index.html" >
    <fieldset>
        <legend>Iniciar sessió</legend>
        <div class="juntarCamps">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email"
                aria-required="true" aria-describedby="emailHint" />
            <p class="hint" id="emailHint"></p>
        </div>
        <div class="juntarCamps">
            <label for="pass">Contrasenya</label>
            <input class="campslog" id="pass" name="pass" type="password" autocomplete="current-password"
                aria-required="true" aria-describedby="passHint" />
            <p class="hint" id="passHint"></p>
        </div>
    </fieldset>

                <a href="#"> Heu oblidat la contrasenya?</a>

                <button class="botons" type="submit">Iniciar</button>

                <div class="separador">
                    <span></span>
                    <p>O AMB</p>
                    <span></span>
                </div>
                <div class="botonsSocials">
                    <button class="botons" type="button">Google</button>
                    <button class="botons" type="button">Git hub</button>
                </div>

            </form>

            <figure class="contenidorImatge">
                <h2 class="titolImatge"> Els teus apunts,<br>
                    en un mateix lloc</h2>

                <picture>
                    <source srcset="../public/img/login/login.png">
                    <!-- IMATGE PRINCIPAL  GRAN -->
                    <img class="imatge" src="../public/img/login/login.webp" alt="ICONE LLAPIS">
                </picture>

            </figure>
        </div>

    </main>
    <footer>
        <p>© 2026 WinDocs · Privacitat · Contacte</p>
    </footer>
</body>

</html>
